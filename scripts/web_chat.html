<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Web Local - Qwen 3.8 27B Dual GPU</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css">
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-sidebar: #1e293b;
      --bg-chat: #0f172a;
      --bg-user: #2563eb;
      --bg-ai: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    
    header {
      background-color: var(--bg-sidebar);
      padding: 12px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { font-weight: 700; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; color: var(--accent); }
    .status-badge {
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 9999px;
      background: #166534;
      color: #86efac;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }
    
    main { flex: 1; display: flex; flex-direction: column; max-width: 900px; width: 100%; margin: 0 auto; overflow: hidden; padding: 16px; }
    #chat-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding-right: 8px; }
    
    .message { display: flex; flex-direction: column; max-width: 85%; animation: fadeIn 0.2s ease; }
    .message.user { align-self: flex-end; }
    .message.assistant { align-self: flex-start; }
    
    .msg-header { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
    .msg-bubble {
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.6;
      font-size: 0.95rem;
      word-break: break-word;
    }
    .user .msg-bubble { background-color: var(--bg-user); color: #fff; border-bottom-right-radius: 2px; }
    .assistant .msg-bubble { background-color: var(--bg-ai); border: 1px solid var(--border-color); border-bottom-left-radius: 2px; }
    
    .think-block {
      background: rgba(0, 0, 0, 0.3);
      border-left: 3px solid var(--accent);
      padding: 8px 12px;
      margin-bottom: 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .think-title { font-weight: bold; color: var(--accent); margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
    
    pre { background: #000 !important; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; border: 1px solid var(--border-color); }
    code { font-family: Consolas, monospace; font-size: 0.9em; }
    
    #input-form {
      margin-top: 16px;
      display: flex;
      gap: 12px;
      background: var(--bg-sidebar);
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }
    #prompt-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1rem;
      outline: none;
      resize: none;
      max-height: 120px;
      min-height: 24px;
      padding: 4px;
    }
    #send-btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <header>
    <div class="brand">⚡ Qwen 3.8 27B - Dual GPU Web Chat</div>
    <div class="status-badge" id="status-badge">
      <div class="status-dot"></div>
      <span id="model-label">Conectando...</span>
    </div>
  </header>

  <main>
    <div id="chat-container">
      <div class="message assistant">
        <div class="msg-header">Qwen 3.8 27B</div>
        <div class="msg-bubble">Olá! Estou operando 100% na sua Dual GPU (RTX 5070 + RTX 2080 Ti). Como posso te ajudar hoje?</div>
      </div>
    </div>

    <form id="input-form">
      <textarea id="prompt-input" placeholder="Digite sua mensagem aqui... (Enter para enviar, Shift+Enter para quebra de linha)" rows="1"></textarea>
      <button type="submit" id="send-btn">Enviar</button>
    </form>
  </main>

  <script>
    const API_BASE = "http://127.0.0.1:8080/v1";
    let activeModel = "qwen3.8-27b";
    const chatContainer = document.getElementById("chat-container");
    const promptInput = document.getElementById("prompt-input");
    const inputForm = document.getElementById("input-form");
    const sendBtn = document.getElementById("send-btn");
    const modelLabel = document.getElementById("model-label");
    
    let history = [
      { role: "system", content: "Você é o assistente de desenvolvimento e engenharia do Qwen 3.8 27B, respondendo sempre com precisão técnica em Português (PT-BR)." }
    ];

    async function checkModel() {
      try {
        const res = await fetch(`${API_BASE}/models`);
        if (res.ok) {
          const data = await res.json();
          if (data.data && data.data.length > 0) {
            activeModel = data.data[0].id;
            modelLabel.innerText = "Qwen 3.8 27B (Dual GPU)";
            document.getElementById("status-badge").style.background = "#166534";
            document.getElementById("status-badge").style.color = "#86efac";
            return;
          }
        }
      } catch(e) {}
      modelLabel.innerText = "Servidor Offline";
      document.getElementById("status-badge").style.background = "#7f1d1d";
      document.getElementById("status-badge").style.color = "#fca5a5";
    }

    checkModel();
    setInterval(checkModel, 5000);

    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        inputForm.dispatchEvent(new Event("submit"));
      }
    });

    inputForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = promptInput.value.trim();
      if (!text) return;

      appendMessage("user", text);
      promptInput.value = "";
      sendBtn.disabled = true;

      history.push({ role: "user", content: text });

      const aiMsgElem = appendMessage("assistant", "Pensando...");
      const bubble = aiMsgElem.querySelector(".msg-bubble");

      try {
        const res = await fetch(`${API_BASE}/chat/completions`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: activeModel,
            messages: history,
            temperature: 0.2
          })
        });

        if (!res.ok) throw new Error(`Erro do Servidor: ${res.status}`);

        const data = await res.json();
        const reply = data.choices[0].message.content || "";
        history.push({ role: "assistant", content: reply });

        renderAIMessage(bubble, reply);
      } catch (err) {
        bubble.innerHTML = `<span style="color: #ef4444;">Erro ao gerar resposta: ${err.message}</span>`;
      } finally {
        sendBtn.disabled = false;
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    });

    function appendMessage(role, text) {
      const msgDiv = document.createElement("div");
      msgDiv.className = `message ${role}`;
      msgDiv.innerHTML = `
        <div class="msg-header">${role === "user" ? "Você" : "Qwen 27B"}</div>
        <div class="msg-bubble">${escapeHtml(text)}</div>
      `;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgDiv;
    }

    function renderAIMessage(bubbleElem, text) {
      let content = text;
      let thinkHtml = "";

      if (content.includes("<think>") && content.includes("</think>")) {
        const parts = content.split("</think>");
        const thinkText = parts[0].replace("<think>", "").trim();
        content = parts[1].trim();
        thinkHtml = `
          <div class="think-block">
            <div class="think-title">🧠 Raciocínio Interno</div>
            ${marked.parse(thinkText)}
          </div>
        `;
      }

      bubbleElem.innerHTML = thinkHtml + marked.parse(content);
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
